[claims.authz-command-classification-data-driven]
text = "Shell command classification is data-driven: dangerousHeads/readonlyHeads/networkHeads/subcommands come from <MAZI_HOME>/config/auth/commands.json merged over DEFAULT_COMMAND_POLICY, while code keeps only command-agnostic hard conditions. Interpreter/privilege heads (sh/bash/zsh/fish/eval/exec/source/sudo/su/doas) are always dangerous and cannot be relaxed, shell metacharacters block readonly relaxation, a listed readonly subcommand relaxes the approval key to the command name, package-manager test/build/run/install stay unknown (workspace-write norm), and unknown git/docker subcommands stay dangerous. Approval keys follow the class: dangerous = full command line with once-only scope, readonly = command name, otherwise full command line."
status = "active"
evidence = [
