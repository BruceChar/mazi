[claims.monorepo-test-and-typecheck-pipeline]
text = "Test execution does not go through Turborepo: turbo.json defines test as dependsOn build with empty outputs, but the root `test` script runs a single root-level `vitest run --passWithNoTests` under one vitest.config.ts whose only settings are testTimeout/hookTimeout=15s (raised because project-wiki cases spawn git and python subprocesses and would flake at the 5s default under ~198 parallel workers). Type-checking is the real per-package gate: composite `tsc -b` project references in packages (runtime → core/libs/provider, provider → core, api → core+runtime) and `vue-tsc --noEmit` for apps/webui, which compiles with noEmit and allowImportingTsExtensions."
