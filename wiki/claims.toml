[claims.authz-ceiling-auto-boundary]
text = "The human permission ceiling (text/read-only/draft/approved/autonomous) is an auto boundary, not a visibility filter: grantForPermissionLevel puts every standard capability into the grant and marks those at or below the selected level auto while the rest become gated, so an out-of-level tool stays visible and its invocation raises human approval instead of disappearing. Only ceiling text empties the tool surface, and forbidden is reserved for the hard floor. Reading the ceiling as a filter misjudges why a tool appears but refuses to run."
