[claims.project-wiki-incremental-preflight]
text = "Wiki init returns without launching an Agent when existing claims or a non-TODO index prove initialization. Cold init uses a bounded 24-step Agent and explicit read limits so it starts writing before exploring the whole project. Update and SessionEnd obtain a structured diff/status plan plus evidence-oid findings; SessionEnd additionally extracts safe files actually read by the completed session trace and starts bounded semantic capture even without a git diff. Explicit updates read only changed files, automatic capture reads only filtered research files, and true claims can be batch-verified with claim verify --ids."
