<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>mazi · harness</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<div class="app">
  <header class="topbar">
    <span class="brand">mazi<em>·</em>harness</span>
    <span class="top-mid dim" id="cfgline">…</span>
    <span class="top-status"><i id="dot" class="dot"></i><span id="busy">idle</span><span id="apilog" class="dim" style="margin-left:12px"></span></span>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <div class="side-head">
        <input id="sess-search" placeholder="搜索会话…" />
        <button id="new-session" class="ghost" title="Ctrl+Enter 发送">＋ 新建</button>
      </div>
      <ul id="session-list" class="list"></ul>
    </aside>

    <section class="main">
      <div class="composer">
        <textarea id="input" rows="3" placeholder="任务描述，例如：读取 README.md 并汇报"></textarea>
        <div class="composer-row">
          <input id="user" placeholder="userId（可选）" />
          <button id="create" class="ghost" title="只创建会话，稍后执行">仅创建会话</button>
          <button id="run" class="primary">创建并运行</button>
        </div>
      </div>
      <div class="session-head" id="session-head"></div>
      <div class="timeline" id="timeline"></div>
    </section>

    <aside class="right">
      <div class="tabs">
        <button data-tab="audit" class="tab active">审计</button>
        <button data-tab="events" class="tab">事件</button>
      </div>
      <div id="tab-audit" class="tab-body">
        <h4 class="lbl">选择 timeline 节点查看三方记录 / Usage</h4>
        <pre id="audit" class="audit">—</pre>
      </div>
      <div id="tab-events" class="tab-body hidden">
        <div class="col-head"><span class="lbl">事件流</span><span id="evcount" class="dim"></span></div>
        <pre id="events" class="log">—</pre>
      </div>
    </aside>
  </main>

  <footer class="bottom-bar" id="bottom-bar">
    <span>turns <b id="m-turns">0</b></span><span>steps <b id="m-steps">0</b></span>
    <span>tokens <b id="m-tokens">0</b></span><span>cost <b id="m-cost">$0</b></span>
    <span id="m-driver" class="dim">driver: -</span>
  </footer>
</div>
<script src="/app.js"></script>
</body>
</html>
